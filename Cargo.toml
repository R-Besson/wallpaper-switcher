[package]
name = "wallpaper-switcher"
version = "0.2.0"
description = "A modern desktop app that fetches high-res wallpapers from Unsplash."
authors = ["R-Besson"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-log = "2"
reqwest = { version = "0.13.1", default-features = false, features = ["json", "query", "native-tls", "http2", "charset", "system-proxy"] }
tokio = { version = "1.49.0", features = ["full"] }
anyhow = "1.0.100"
display-info = "0.5.7"
rand = "0.9.2"
dirs = "6.0.0"
humantime = "2.3.0"
user-idle = "0.6.0"
wallpaper = "3.2.0"
system-tray = "0.8.5"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2.3.7"
