[package]
name = "wallpaper-switcher"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
display-info = "0.5.7"
dirs = "6.0.0"
humantime = "2.3.0"
reqwest = { version = "0.13.1", default-features = false, features = ["json", "query", "native-tls", "http2", "charset", "system-proxy"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
wallpaper = "3.2.0"
rand = "0.9.2"
user-idle = "0.6.0"
tray-icon = "0.21.3"
tao = "0.34.5"
